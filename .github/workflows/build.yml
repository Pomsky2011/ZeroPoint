name: Multi-Platform Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Build (x64)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # run-vcpkg requires *some* baseline (this repo has no vcpkg.json to
    # supply one) — it errors outright if vcpkgGitCommitId is omitted, it
    # doesn't float to a branch tip. The previous pin (Nov 2023) had gone
    # stale: MSYS2 mirrors had GC'd a package version that era's sdl2 port
    # depended on, and its vcpkg-cmake helper scripts predated solid
    # arm64-windows toolchain detection. Re-pinned to a current commit
    # (2026-07-14); this will need bumping again eventually.
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'db4723bd0a99eab031f1a3dee4336dca43049c87'

    # run-vcpkg points VCPKG_BINARY_SOURCES at the GHA cache (x-gha), but the
    # ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN env vars it needs aren't exposed
    # to plain shell steps — only to actions/github-script's Node process.
    - name: Export GHA cache credentials for vcpkg
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install SDL2 (vcpkg)
      run: |
        vcpkg install sdl2:x64-windows

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        arch: 'win64_msvc2022_64'

    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        install_runtime: true
        cache: true

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: |
        cmake --build build --config Release -j

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zeropoint-windows-x64
        path: |
          build/bin/Release/*.exe
          build/bin/Release/*.dll
        retention-days: 30

  build-windows-arm64:
    name: Windows Build (ARM64)
    # Native ARM64 runner — cross-compiling from an x64 host (via `-A ARM64`)
    # would need ARM64 Qt host-tool binaries and an ARM64 Vulkan SDK that
    # neither install-qt-action nor install-vulkan-sdk-action can produce
    # from an x64 host. Building natively sidesteps both problems.
    runs-on: windows-11-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # run-vcpkg requires *some* baseline (this repo has no vcpkg.json to
    # supply one) — it errors outright if vcpkgGitCommitId is omitted, it
    # doesn't float to a branch tip. The previous pin (Nov 2023) had gone
    # stale: MSYS2 mirrors had GC'd a package version that era's sdl2 port
    # depended on, and its vcpkg-cmake helper scripts predated solid
    # arm64-windows toolchain detection. Re-pinned to a current commit
    # (2026-07-14); this will need bumping again eventually.
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'db4723bd0a99eab031f1a3dee4336dca43049c87'

    - name: Export GHA cache credentials for vcpkg
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install SDL2 (vcpkg)
      run: |
        vcpkg install sdl2:arm64-windows

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        arch: 'win64_msvc2022_arm64'

    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        install_runtime: true
        cache: true

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: |
        cmake --build build --config Release -j

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zeropoint-windows-arm64
        path: |
          build/bin/Release/*.exe
          build/bin/Release/*.dll
        retention-days: 30

  build-linux:
    name: Linux Build (x86_64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libsdl2-dev \
          qt6-base-dev \
          qt6-base-dev-tools

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build -j$(nproc)

    - name: Determinism golden check
      run: |
        ./build/bin/fuzz_determinism "$RUNNER_TEMP" --golden-check tools/determinism_golden.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zeropoint-linux-x86_64
        path: build/bin/*
        retention-days: 30

  build-linux-arm64:
    name: Linux Build (ARM64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Build in ARM64 container
      run: |
        docker run --rm --platform linux/arm64 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          arm64v8/ubuntu:22.04 \
          bash -c "
            apt-get update && \
            apt-get install -y \
              build-essential \
              cmake \
              libsdl2-dev \
              libvulkan-dev \
              qt6-base-dev \
              qt6-base-dev-tools && \
            cmake -B build -DCMAKE_BUILD_TYPE=Release && \
            cmake --build build -j\$(nproc) && \
            mkdir -p /tmp/zpfz && \
            ./build/bin/fuzz_determinism /tmp/zpfz --golden-check tools/determinism_golden.txt
          "

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zeropoint-linux-arm64
        path: build/bin/*
        retention-days: 30

  build-macos-intel:
    name: macOS Build (Intel x86_64)
    # Native x86_64 on GitHub's Intel macOS image. (The old approach - cross-compiling on an Apple Silicon runner against
    # a Rosetta-installed x86_64 Homebrew - is dead: Homebrew's installer now refuses to run under Rosetta, and an x86_64
    # macOS VM can't run on Apple Silicon at all.) If this label doesn't schedule on this repo (it has been billed as a
    # "larger runner" before; macos-13 stopped scheduling entirely), the job sits queued: cancel it and see
    # docs/determinism-proof.md for the Rosetta core-only alternative.
    runs-on: macos-15-intel

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install sdl2 qt vulkan-headers vulkan-loader molten-vk cmake

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix qt)"

    - name: Build
      run: |
        cmake --build build -j$(sysctl -n hw.ncpu)

    - name: Determinism golden check
      run: |
        ./build/bin/fuzz_determinism "$RUNNER_TEMP" --golden-check tools/determinism_golden.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zeropoint-macos-intel
        path: build/bin/*
        retention-days: 30

  build-macos-arm64:
    name: macOS Build (Apple Silicon ARM64)
    runs-on: macos-15  # Apple Silicon runner (macos-14 is deprecated)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install sdl2 qt cmake vulkan-headers vulkan-loader molten-vk

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix qt)"

    - name: Build
      run: |
        cmake --build build -j$(sysctl -n hw.ncpu)

    - name: Determinism golden check
      run: |
        ./build/bin/fuzz_determinism "$RUNNER_TEMP" --golden-check tools/determinism_golden.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zeropoint-macos-arm64
        path: build/bin/*
        retention-days: 30

    - name: Test JIT (ARM64)
      run: |
        ./build/bin/test_cpu || true

  build-summary:
    name: Build Summary
    needs: [build-windows, build-windows-arm64, build-linux, build-linux-arm64, build-macos-intel, build-macos-arm64]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Check build status
      run: |
        echo "================================"
        echo "    ZeroPoint Build Summary     "
        echo "================================"
        echo ""
        echo "Windows Builds:"
        echo "  x64:   ${{ needs.build-windows.result }}"
        echo "  ARM64: ${{ needs.build-windows-arm64.result }}"
        echo ""
        echo "Linux Builds:"
        echo "  x86_64: ${{ needs.build-linux.result }}"
        echo "  ARM64:  ${{ needs.build-linux-arm64.result }}"
        echo ""
        echo "macOS Builds:"
        echo "  Intel (x86_64):      ${{ needs.build-macos-intel.result }}"
        echo "  Apple Silicon (ARM64): ${{ needs.build-macos-arm64.result }}"
        echo ""
        echo "================================"
